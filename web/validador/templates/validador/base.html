<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Validador de precatórios{% endblock %}</title>
  <style>
    :root { --fundo:#f6f7f9; --texto:#1d2330; --borda:#d8dce3; --ok:#1f7a3f; --corr:#1d5fa8; --desc:#6b7280; --pend:#b45309; --erro:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--fundo); color:var(--texto); }
    header { background:#1d2330; color:#fff; padding:12px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    header a { color:#fff; text-decoration:none; } header .sair { margin-left:auto; }
    header button { background:none; border:1px solid #fff6; color:#fff; padding:4px 10px; border-radius:4px; cursor:pointer; }
    main { max-width:1200px; margin:0 auto; padding:16px; }
    h1 { font-size:1.4rem; } h2 { font-size:1.1rem; margin-top:28px; }
    table { width:100%; border-collapse:collapse; background:#fff; font-size:13px; }
    th, td { border:1px solid var(--borda); padding:6px 8px; text-align:left; vertical-align:top; }
    th { background:#eef0f4; }
    .tabela { overflow-x:auto; }
    .status { font-weight:600; font-size:12px; padding:2px 6px; border-radius:4px; color:#fff; white-space:nowrap; }
    .OK { background:var(--ok); } .CORRIGIDO { background:var(--corr); } .DESCARTADO { background:var(--desc); } .PENDENTE { background:var(--pend); }
    .msg { padding:8px 12px; border-radius:4px; margin:6px 0; background:#fff; border-left:4px solid var(--corr); }
    .msg.error { border-color:var(--erro); } .msg.success { border-color:var(--ok); }
    .cartoes { display:flex; gap:8px; flex-wrap:wrap; }
    .cartao { background:#fff; border:1px solid var(--borda); border-radius:6px; padding:8px 14px; min-width:110px; }
    .cartao b { display:block; font-size:1.4rem; }
    .aviso { background:#fff7e6; border:1px solid #f0c36d; padding:8px 12px; border-radius:4px; }
    button.primario { background:var(--corr); color:#fff; border:0; padding:8px 16px; border-radius:4px; cursor:pointer; }
    button[disabled] { background:#9aa3b2; cursor:not-allowed; }
    code { font-size:12px; } .info { color:#555; font-size:12px; }
    form.inline { display:flex; gap:6px; flex-wrap:wrap; align-items:flex-start; } textarea { width:260px; }
  </style>
</head>
<body>
<header>
  <a href="{% url 'inicio' %}"><b>Validador de precatórios</b></a>
  {% block nav %}{% endblock %}
  {% if user.is_authenticated %}
  <form class="sair" method="post" action="{% url 'logout' %}">{% csrf_token %}
    <span>{{ user.get_username }}</span> <button type="submit">Sair</button>
  </form>
  {% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
