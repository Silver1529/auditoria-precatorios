[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "precatorios-validator"
version = "0.1.0"
description = "Validação e limpeza de eventos de pagamento de precatórios"
requires-python = ">=3.10"
dependencies = ["tzdata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "web"]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"
